[project]
name = "support-agent"
version = "0.1.0"
description = "Multilingual (Arabic, Tunisian Arabic, French, English) customer support agent for e-commerce shops"
readme = "../README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "fastapi>=0.165",
    "uvicorn[standard]>=0.54",
    "python-multipart>=0.0.34",
    "email-validator>=2.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1",
    "psycopg[binary]>=3.3",
    "alembic>=1.20",
    "pgvector>=0.5",
    "langgraph>=1.2",
    "langchain-text-splitters>=1.1",
    "openai>=3.57",
    "langfuse>=5.2",
    "fastembed>=0.9",
    "faster-whisper>=1.2",
    "pypdf>=7.1",
    "python-docx>=1.2",
    "pyjwt>=2.15",
    "pwdlib[argon2]>=0.4",
    "structlog>=26.1",
    "lingua-language-detector>=2.2",
    "mcp>=2.3",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "ruff>=0.17",
    "mypy>=2.4",
    "fpdf2>=2.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "security: adversarial security tests",
    "integration: tests that need PostgreSQL",
    "models: tests that load the local embedding/reranker models",
]
filterwarnings = ["ignore::DeprecationWarning:fastembed.*"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"evals/**" = ["S311"]
"app/seed/**" = ["S105", "S311"]
"migrations/**" = ["E501"]
# Multilingual reply templates and detection patterns are data; wrapping them hurts readability.
"app/agent/templates.py" = ["E501"]
"app/security/guardrails.py" = ["E501"]
"app/agent/heuristics.py" = ["E501"]
"app/llm/router.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
